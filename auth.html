<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Authentication - Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for Modal and Dropdown Lists */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Static Rainbow Conic Gradient Border */
    .rainbow-border {
      background: conic-gradient(from 0deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 overflow-hidden flex flex-col justify-end">

  <!-- BOTTOM SHEET / SCREEN MODAL -->
  <div class="relative w-full h-[90vh] max-h-[94vh] bg-slate-900 border-t border-x border-slate-800/80 rounded-t-[36px] shadow-2xl shadow-indigo-950/20 flex flex-col pt-12 overflow-visible">

    <!-- PROMINENT FLOATING LOGO OVERLAP (FULLY VISIBLE ON TOP) -->
    <div class="absolute -top-10 left-1/2 -translate-x-1/2 z-30 pointer-events-none">
      <div class="relative w-20 h-20 flex items-center justify-center">
        <!-- Static Rainbow Outer Ring -->
        <div class="absolute inset-0 rounded-full rainbow-border opacity-90 blur-[1px]"></div>
        
        <!-- Logo Outer Shell -->
        <div class="relative w-[72px] h-[72px] rounded-full bg-slate-900 p-[3px] flex items-center justify-center shadow-2xl">
          <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center overflow-hidden">
            
            <!-- PURE CSS GEOMETRIC PENGUIN LOGO MARK -->
            <div class="relative w-10 h-10 flex items-center justify-center">
              <!-- Left Flipper -->
              <div class="absolute top-[12px] left-[3px] w-[7px] h-[14px] bg-slate-800 rounded-l-full -rotate-[25deg] origin-top-right"></div>
              
              <!-- Right Flipper -->
              <div class="absolute top-[12px] right-[3px] w-[7px] h-[14px] bg-slate-800 rounded-r-full rotate-[25deg] origin-top-left"></div>

              <!-- Penguin Main Body -->
              <div class="relative w-[22px] h-[26px] bg-slate-800 rounded-t-full rounded-b-lg flex flex-col items-center justify-center z-10">
                
                <!-- White Belly/Face Oval -->
                <div class="w-[15px] h-[21px] bg-slate-100 rounded-t-full rounded-b-sm flex flex-col items-center justify-start relative overflow-hidden">
                  
                  <!-- Eye Row -->
                  <div class="w-full flex justify-between px-[3px] mt-[4px] z-10">
                    <div class="w-[2.5px] h-[2.5px] bg-slate-950 rounded-full"></div>
                    <div class="w-[2.5px] h-[2.5px] bg-slate-950 rounded-full"></div>
                  </div>

                  <!-- Orange Beak -->
                  <div class="w-[5px] h-[3.5px] bg-amber-500 rounded-b-full z-10 -mt-[1px]"></div>
                  
                  <!-- Cheeks -->
                  <div class="w-full flex justify-between px-[2px] -mt-[1px]">
                    <div class="w-[2px] h-[2px] bg-rose-300/80 rounded-full"></div>
                    <div class="w-[2px] h-[2px] bg-rose-300/80 rounded-full"></div>
                  </div>

                </div>

                <!-- Feet -->
                <div class="absolute -bottom-[3px] w-[18px] flex justify-between px-[1px]">
                  <div class="w-[5px] h-[3px] bg-amber-500 rounded-full"></div>
                  <div class="w-[5px] h-[3px] bg-amber-500 rounded-full"></div>
                </div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- FIXED HEADER & TAB SWITCHER CONTAINER -->
    <div class="w-full max-w-md mx-auto px-6 sm:px-8 shrink-0 bg-slate-900 z-10 pb-3 border-b border-slate-800/50">
      <!-- Header Branding -->
      <div class="text-center space-y-1 mb-4">
        <h1 id="authTitle" class="text-2xl font-extrabold text-slate-100 tracking-tight">Welcome Back</h1>
        <p id="authSubtitle" class="text-xs text-slate-400">Securely access your account</p>
      </div>

      <!-- Fixed Toggle Tabs (Sign In / Sign Up) -->
      <div id="authTabs" class="grid grid-cols-2 bg-slate-950 p-1 rounded-2xl border border-slate-800/80 text-xs font-semibold select-none">
        <button type="button" onclick="switchMode('signin')" id="tabSignIn" class="py-2.5 rounded-xl bg-indigo-600 text-white shadow transition-all">Sign In</button>
        <button type="button" onclick="switchMode('signup')" id="tabSignUp" class="py-2.5 rounded-xl text-slate-400 hover:text-slate-200 transition-all">Sign Up</button>
      </div>
    </div>

    <!-- SCROLLABLE CONTENT CONTAINER -->
    <div class="w-full max-w-md mx-auto flex-1 overflow-y-auto custom-scrollbar pt-4 pb-8 px-6 sm:px-8 space-y-6">

      <!-- Feedback Message Box -->
      <div id="formMessage" class="hidden text-xs p-3 rounded-xl border text-center font-medium transition-all"></div>

      <!-- MAIN AUTH FORM -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-xs flex flex-col justify-between">
        
        <div class="space-y-4">
          <!-- ================= SIGN IN FIELDS ================= -->
          <div id="signInFields" class="space-y-4">
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Handle or Email Address <span class="text-rose-400">*</span></label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                  <i class="fa-solid fa-user"></i>
                </span>
                <input 
                  type="text" 
                  id="loginIdentifier" 
                  required
                  placeholder="@handle or name@example.com" 
                  class="w-full bg-slate-950 text-slate-100 text-xs pl-10 pr-3.5 py-3.5 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
                />
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="block text-[11px] font-medium text-slate-400">Password <span class="text-rose-400">*</span></label>
                <button type="button" onclick="switchMode('forgot')" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  Forgot password?
                </button>
              </div>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input 
                  type="password" 
                  id="loginPassword" 
                  required
                  placeholder="••••••••" 
                  class="w-full bg-slate-950 text-slate-100 text-xs pl-10 pr-10 py-3.5 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
                />
                <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
                  <i id="loginEyeIcon" class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- ================= SIGN UP FIELDS ================= -->
          <div id="signUpFields" class="space-y-3.5 hidden">
            
            <!-- MANDATORY PROFILE IMAGE UPLOAD (MAX 5MB) -->
            <div class="flex flex-col items-center justify-center space-y-2 pb-1">
              <label class="block text-[11px] font-medium text-slate-400">Profile Picture (Max 5MB) <span class="text-rose-400">*</span></label>
              <div class="relative group cursor-pointer" onclick="document.getElementById('avatarFileInput').click()">
                <div class="w-20 h-20 rounded-full bg-slate-950 border-2 border-dashed border-indigo-500/60 group-hover:border-indigo-400 overflow-hidden flex items-center justify-center shadow-lg transition-colors">
                  <img id="avatarPreview" src="" class="w-full h-full object-cover hidden" alt="Avatar preview" />
                  <div id="avatarPlaceholder" class="flex flex-col items-center text-slate-500 group-hover:text-indigo-400 transition-colors">
                    <i class="fa-solid fa-camera text-lg mb-1"></i>
                    <span class="text-[9px] font-semibold">Upload</span>
                  </div>
                </div>
                <div class="absolute bottom-0 right-0 w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-[10px] shadow border border-slate-900">
                  <i class="fa-solid fa-plus"></i>
                </div>
              </div>
              <input 
                type="file" 
                id="avatarFileInput" 
                accept="image/*" 
                onchange="previewAvatar(event)" 
                class="hidden" 
              />
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Full Name <span class="text-rose-400">*</span></label>
              <input 
                type="text" 
                id="signupName" 
                placeholder="John Doe" 
                class="w-full bg-slate-950 text-slate-100 text-xs px-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
              />
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-[11px] font-medium text-slate-400">Create Handle <span class="text-rose-400">*</span></label>
                <span id="handleCounter" class="text-[10px] text-slate-500 font-mono">0/12 max</span>
              </div>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">@</span>
                <input 
                  type="text" 
                  id="signupHandle" 
                  maxlength="12" 
                  oninput="updateHandleCounter()"
                  placeholder="username" 
                  class="w-full bg-slate-950 text-slate-100 text-xs pl-8 pr-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
                />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Email Address <span class="text-rose-400">*</span></label>
              <input 
                type="email" 
                id="signupEmail" 
                placeholder="name@example.com" 
                class="w-full bg-slate-950 text-slate-100 text-xs px-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
              />
            </div>

            <!-- PHONE NUMBER FIELD -->
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Phone Number <span class="text-rose-400">*</span></label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                  <i class="fa-solid fa-phone text-[11px]"></i>
                </span>
                <input 
                  type="tel" 
                  id="signupPhone" 
                  placeholder="+234 800 000 0000" 
                  class="w-full bg-slate-950 text-slate-100 text-xs pl-10 pr-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
                />
              </div>
            </div>

            <!-- CUSTOM STATE SELECTOR (APP-STYLE DROPDOWN) -->
            <div class="relative">
              <label class="block text-[11px] font-medium text-slate-400 mb-1">State (Nigeria) <span class="text-rose-400">*</span></label>
              <div 
                id="stateTrigger"
                onclick="toggleDropdown('stateDropdown')"
                class="w-full bg-slate-950 text-slate-100 text-xs pl-10 pr-10 py-3 rounded-xl border border-slate-800 hover:border-indigo-500 transition-colors cursor-pointer flex items-center justify-between relative"
              >
                <span class="absolute left-3.5 text-slate-500"><i class="fa-solid fa-map-location-dot"></i></span>
                <span id="selectedStateText" class="text-slate-400 truncate">Select your state</span>
                <span class="absolute right-3.5 text-slate-400"><i class="fa-solid fa-chevron-down text-[10px]"></i></span>
              </div>
              <input type="hidden" id="signupStateValue" />

              <!-- State Popup List -->
              <div id="stateDropdown" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col max-h-56">
                <div class="p-2 border-b border-slate-800 bg-slate-950">
                  <input 
                    type="text" 
                    id="stateSearchInput" 
                    oninput="filterStates(event)" 
                    placeholder="Search state..." 
                    class="w-full bg-slate-900 text-slate-100 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:border-indigo-500 focus:outline-none"
                    onclick="event.stopPropagation()"
                  />
                </div>
                <div id="stateListContainer" class="overflow-y-auto custom-scrollbar p-1 space-y-0.5">
                  <!-- Dynamically populated via JS -->
                </div>
              </div>
            </div>

            <!-- CUSTOM LGA SELECTOR (APP-STYLE DROPDOWN) -->
            <div class="relative">
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Local Government Area (LGA) <span class="text-rose-400">*</span></label>
              <div 
                id="lgaTrigger"
                onclick="toggleDropdown('lgaDropdown')"
                class="w-full bg-slate-950 text-slate-100 text-xs pl-10 pr-10 py-3 rounded-xl border border-slate-800 transition-colors cursor-pointer flex items-center justify-between relative opacity-45 cursor-not-allowed"
              >
                <span class="absolute left-3.5 text-slate-500"><i class="fa-solid fa-location-crosshairs"></i></span>
                <span id="selectedLgaText" class="text-slate-500 truncate">Select state first</span>
                <span class="absolute right-3.5 text-slate-400"><i class="fa-solid fa-chevron-down text-[10px]"></i></span>
              </div>
              <input type="hidden" id="signupLgaValue" />

              <!-- LGA Popup List -->
              <div id="lgaDropdown" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col max-h-56">
                <div class="p-2 border-b border-slate-800 bg-slate-950">
                  <input 
                    type="text" 
                    id="lgaSearchInput" 
                    oninput="filterLgas(event)" 
                    placeholder="Search LGA..." 
                    class="w-full bg-slate-900 text-slate-100 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:border-indigo-500 focus:outline-none"
                    onclick="event.stopPropagation()"
                  />
                </div>
                <div id="lgaListContainer" class="overflow-y-auto custom-scrollbar p-1 space-y-0.5">
                  <!-- Dynamically populated via JS -->
                </div>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Create Password <span class="text-rose-400">*</span></label>
              <div class="relative">
                <input 
                  type="password" 
                  id="signupPassword" 
                  placeholder="••••••••" 
                  class="w-full bg-slate-950 text-slate-100 text-xs px-3.5 pr-10 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
                />
                <button type="button" onclick="togglePasswordVisibility('signupPassword', 'signupEyeIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
                  <i id="signupEyeIcon" class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Confirm Password <span class="text-rose-400">*</span></label>
              <input 
                type="password" 
                id="signupConfirmPassword" 
                placeholder="••••••••" 
                class="w-full bg-slate-950 text-slate-100 text-xs px-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
              />
            </div>

            <!-- MANDATORY TERMS & POLICIES CHECKBOX -->
            <div class="pt-2 space-y-2.5">
              <label class="flex items-start space-x-2.5 cursor-pointer group">
                <input 
                  type="checkbox" 
                  id="agreeTerms" 
                  class="mt-0.5 rounded border-slate-800 bg-slate-950 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer" 
                />
                <span class="text-[11px] text-slate-400 leading-tight group-hover:text-slate-300 transition-colors">
                  I have read, understood, and agree to the 
                  <a href="#" class="text-indigo-400 hover:underline">Terms of Use</a>, 
                  <a href="#" class="text-indigo-400 hover:underline">Privacy Policy</a>, 
                  <a href="#" class="text-indigo-400 hover:underline">Cookie Policy</a>, 
                  <a href="#" class="text-indigo-400 hover:underline">Kito Protection Policy</a>, and all other official platform legal policies. <span class="text-rose-400">*</span>
                </span>
              </label>

              <!-- CHROME PUSH NOTIFICATIONS CHECKBOX -->
              <label class="flex items-start space-x-2.5 cursor-pointer group">
                <input 
                  type="checkbox" 
                  id="allowPushNotifications" 
                  class="mt-0.5 rounded border-slate-800 bg-slate-950 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer" 
                />
                <span class="text-[11px] text-slate-400 leading-tight group-hover:text-slate-300 transition-colors">
                  Enable browser push notifications to receive real-time security updates, direct messages, and portal alerts via Google Chrome.
                </span>
              </label>
            </div>

          </div>

          <!-- ================= FORGOT PASSWORD FIELDS ================= -->
          <div id="forgotFields" class="space-y-4 hidden">
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Your Account Email <span class="text-rose-400">*</span></label>
              <input 
                type="email" 
                id="forgotEmail" 
                placeholder="name@example.com" 
                class="w-full bg-slate-950 text-slate-100 text-xs px-3.5 py-3 rounded-xl border border-slate-800 focus:border-indigo-500 focus:outline-none transition-colors" 
              />
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-4">
          <!-- Submit Action Button -->
          <button 
            type="submit" 
            id="submitBtn"
            class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
          >
            <span id="submitBtnText">Sign In</span>
            <i id="submitSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
          </button>
        </div>

      </form>

      <!-- Back to Sign In Link -->
      <div id="backToSignInContainer" class="hidden text-center pt-1">
        <button type="button" onclick="switchMode('signin')" class="text-xs text-slate-400 hover:text-slate-200 font-medium transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
        </button>
      </div>

    </div>

  </div>

  <!-- JavaScript Config & Logic -->

    let currentMode = 'signin';
    let selectedAvatarFile = null;
    const MAX_FILE_SIZE_BYTES = 5 * 1024 * 1024; // 5 Megabytes

    // Initialize Custom Select Lists
    window.addEventListener('DOMContentLoaded', () => {
      populateStates(Object.keys(nigeriaStatesAndLgas).sort());
      
      // Close custom dropdowns when clicking outside
      window.addEventListener('click', (e) => {
        if (!e.target.closest('#stateTrigger') && !e.target.closest('#stateDropdown')) {
          document.getElementById('stateDropdown').classList.add('hidden');
        }
        if (!e.target.closest('#lgaTrigger') && !e.target.closest('#lgaDropdown')) {
          document.getElementById('lgaDropdown').classList.add('hidden');
        }
      });
    });

    function toggleDropdown(dropdownId) {
      if (dropdownId === 'lgaDropdown' && !document.getElementById('signupStateValue').value) {
        return; // Disabled if state not selected
      }
      const dropdown = document.getElementById(dropdownId);
      const isOpen = !dropdown.classList.contains('hidden');
      
      // Close both dropdowns first
      document.getElementById('stateDropdown').classList.add('hidden');
      document.getElementById('lgaDropdown').classList.add('hidden');

      if (!isOpen) {
        dropdown.classList.remove('hidden');
        if (dropdownId === 'stateDropdown') {
          document.getElementById('stateSearchInput').focus();
        } else {
          document.getElementById('lgaSearchInput').focus();
        }
      }
    }

    function populateStates(states) {
      const container = document.getElementById('stateListContainer');
      container.innerHTML = '';
      states.forEach(state => {
        const div = document.createElement('div');
        div.className = "px-3 py-2.5 rounded-lg text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 cursor-pointer text-xs transition-colors font-medium";
        div.textContent = state;
        div.onclick = () => selectState(state);
        container.appendChild(div);
      });
    }

    function filterStates(e) {
      const query = e.target.value.toLowerCase();
      const filtered = Object.keys(nigeriaStatesAndLgas).sort().filter(s => s.toLowerCase().includes(query));
      populateStates(filtered);
    }

    function selectState(state) {
      document.getElementById('signupStateValue').value = state;
      const textElem = document.getElementById('selectedStateText');
      textElem.textContent = state;
      textElem.classList.remove('text-slate-400');
      textElem.classList.add('text-slate-100', 'font-semibold');
      document.getElementById('stateDropdown').classList.add('hidden');

      // Enable LGA trigger
      const lgaTrigger = document.getElementById('lgaTrigger');
      lgaTrigger.classList.remove('opacity-45', 'cursor-not-allowed');
      lgaTrigger.classList.add('hover:border-indigo-500', 'cursor-pointer');

      // Reset LGA selection
      document.getElementById('signupLgaValue').value = '';
      const lgaText = document.getElementById('selectedLgaText');
      lgaText.textContent = 'Select LGA';
      lgaText.classList.remove('text-slate-100', 'font-semibold');
      lgaText.classList.add('text-slate-400');

      populateLgas(nigeriaStatesAndLgas[state].sort());
    }

    function populateLgas(lgas) {
      const container = document.getElementById('lgaListContainer');
      container.innerHTML = '';
      lgas.forEach(lga => {
        const div = document.createElement('div');
        div.className = "px-3 py-2.5 rounded-lg text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-400 cursor-pointer text-xs transition-colors font-medium";
        div.textContent = lga;
        div.onclick = () => selectLga(lga);
        container.appendChild(div);
      });
    }

    function filterLgas(e) {
      const currentState = document.getElementById('signupStateValue').value;
      if (!currentState) return;
      const query = e.target.value.toLowerCase();
      const filtered = nigeriaStatesAndLgas[currentState].sort().filter(l => l.toLowerCase().includes(query));
      populateLgas(filtered);
    }

    function selectLga(lga) {
      document.getElementById('signupLgaValue').value = lga;
      const textElem = document.getElementById('selectedLgaText');
      textElem.textContent = lga;
      textElem.classList.remove('text-slate-400');
      textElem.classList.add('text-slate-100', 'font-semibold');
      document.getElementById('lgaDropdown').classList.add('hidden');
    }

    function switchMode(mode) {
      currentMode = mode;
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      const tabs = document.getElementById('authTabs');
      const signInFields = document.getElementById('signInFields');
      const signUpFields = document.getElementById('signUpFields');
      const forgotFields = document.getElementById('forgotFields');
      const backContainer = document.getElementById('backToSignInContainer');
      const submitBtnText = document.getElementById('submitBtnText');
      const msgBox = document.getElementById('formMessage');
      
      msgBox.classList.add('hidden');

      // Mandatory required attribute flags
      document.getElementById('loginIdentifier').required = (mode === 'signin');
      document.getElementById('loginPassword').required = (mode === 'signin');

      document.getElementById('signupName').required = (mode === 'signup');
      document.getElementById('signupHandle').required = (mode === 'signup');
      document.getElementById('signupEmail').required = (mode === 'signup');
      document.getElementById('signupPhone').required = (mode === 'signup');
      document.getElementById('signupPassword').required = (mode === 'signup');
      document.getElementById('signupConfirmPassword').required = (mode === 'signup');
      document.getElementById('agreeTerms').required = (mode === 'signup');

      document.getElementById('forgotEmail').required = (mode === 'forgot');

      if (mode === 'signin') {
        title.innerText = 'Welcome Back';
        subtitle.innerText = 'Securely access your account';
        tabs.classList.remove('hidden');
        signInFields.classList.remove('hidden');
        signUpFields.classList.add('hidden');
        forgotFields.classList.add('hidden');
        backContainer.classList.add('hidden');
        submitBtnText.innerText = 'Sign In';
        
        document.getElementById('tabSignIn').className = "py-2.5 rounded-xl bg-indigo-600 text-white shadow transition-all";
        document.getElementById('tabSignUp').className = "py-2.5 rounded-xl text-slate-400 hover:text-slate-200 transition-all";
      } 
      else if (mode === 'signup') {
        title.innerText = 'Create Account';
        subtitle.innerText = 'Join and secure your profile';
        tabs.classList.remove('hidden');
        signInFields.classList.add('hidden');
        signUpFields.classList.remove('hidden');
        forgotFields.classList.add('hidden');
        backContainer.classList.add('hidden');
        submitBtnText.innerText = 'Sign Up';

        document.getElementById('tabSignUp').className = "py-2.5 rounded-xl bg-indigo-600 text-white shadow transition-all";
        document.getElementById('tabSignIn').className = "py-2.5 rounded-xl text-slate-400 hover:text-slate-200 transition-all";
      } 
      else if (mode === 'forgot') {
        title.innerText = 'Reset Password';
        subtitle.innerText = 'We will send you a recovery link';
        tabs.classList.add('hidden');
        signInFields.classList.add('hidden');
        signUpFields.classList.add('hidden');
        forgotFields.classList.remove('hidden');
        backContainer.classList.remove('hidden');
        submitBtnText.innerText = 'Send Reset Instructions';
      }
    }

    function previewAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        // Enforce 5MB limit on select
        if (file.size > MAX_FILE_SIZE_BYTES) {
          showMsg('Profile image size exceeds 5MB limit. Please choose a smaller file.', 'error');
          e.target.value = '';
          return;
        }

        selectedAvatarFile = file;
        const reader = new FileReader();
        reader.onload = function(evt) {
          const preview = document.getElementById('avatarPreview');
          const placeholder = document.getElementById('avatarPlaceholder');
          preview.src = evt.target.result;
          preview.classList.remove('hidden');
          placeholder.classList.add('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const passInput = document.getElementById(inputId);
      const eyeIcon = document.getElementById(iconId);
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      }
    }

    function updateHandleCounter() {
      const handleInput = document.getElementById('signupHandle');
      let val = handleInput.value.replace(/[^a-zA-Z0-9_]/g, '');
      if (val.length > 12) val = val.substring(0, 12);
      handleInput.value = val;
      document.getElementById('handleCounter').innerText = `${val.length}/12 max`;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const msgBox = document.getElementById('formMessage');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('submitSpinner');

      if (!supabaseClient) {
        showMsg('Supabase client failed to initialize.', 'error');
        return;
      }

      submitBtn.disabled = true;
      spinner.classList.remove('hidden');
      msgBox.classList.add('hidden');

      try {
        if (currentMode === 'signin') {
          const identifier = document.getElementById('loginIdentifier').value.trim();
          const password = document.getElementById('loginPassword').value;

          let emailToUse = identifier;

          if (!identifier.includes('@') || identifier.startsWith('@')) {
            const cleanHandle = identifier.replace('@', '');
            const { data: profileData, error: profileErr } = await supabaseClient
              .from('profiles')
              .select('email')
              .eq('handle', cleanHandle)
              .single();

            if (profileErr || !profileData) {
              throw new Error('Handle not found. Please log in with your email address.');
            }
            emailToUse = profileData.email;
          }

          const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailToUse, password });
          if (error) throw error;
          
          showMsg('Sign in successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'profile.html';
          }, 1200);
        } 
        else if (currentMode === 'signup') {
          const name = document.getElementById('signupName').value.trim();
          const handle = document.getElementById('signupHandle').value.trim().replace('@', '');
          const email = document.getElementById('signupEmail').value.trim();
          const phone = document.getElementById('signupPhone').value.trim();
          const state = document.getElementById('signupStateValue').value;
          const lga = document.getElementById('signupLgaValue').value;
          const password = document.getElementById('signupPassword').value;
          const confirmPassword = document.getElementById('signupConfirmPassword').value;
          const agreeTerms = document.getElementById('agreeTerms').checked;
          const allowPush = document.getElementById('allowPushNotifications').checked;

          if (!selectedAvatarFile) {
            throw new Error('Please upload a profile picture.');
          }
          if (selectedAvatarFile.size > MAX_FILE_SIZE_BYTES) {
            throw new Error('Profile picture must be less than 5MB.');
          }
          if (!state || !lga) {
            throw new Error('Please select both your State and Local Government Area.');
          }
          if (!phone) {
            throw new Error('Please enter a valid phone number.');
          }
          if (!agreeTerms) {
            throw new Error('You must accept the Terms of Use, Privacy Policy, and other platform policies to sign up.');
          }
          if (password !== confirmPassword) {
            throw new Error('Passwords do not match.');
          }
          if (handle.length > 12) {
            throw new Error('Handle cannot exceed 12 characters.');
          }

          // Request Chrome Web Push permissions if requested
          if (allowPush && 'Notification' in window) {
            try {
              await Notification.requestPermission();
            } catch (err) {
              console.warn('Push notification permission error:', err);
            }
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: name, handle, phone, state, lga, allow_push: allowPush }
            }
          });
          if (error) throw error;

          const userId = data.user?.id;
          let avatarUrl = '';

          if (userId && selectedAvatarFile) {
            const fileExt = selectedAvatarFile.name.split('.').pop();
            const filePath = `${userId}/avatar.${fileExt}`;

            const { error: uploadErr } = await supabaseClient.storage
              .from('avatars')
              .upload(filePath, selectedAvatarFile, { upsert: true });

            if (!uploadErr) {
              const { data: publicUrlData } = supabaseClient.storage
                .from('avatars')
                .getPublicUrl(filePath);
              avatarUrl = publicUrlData.publicUrl;
            }
          }

          if (userId) {
            await supabaseClient.from('profiles').upsert([
              { 
                id: userId, 
                email, 
                full_name: name, 
                handle, 
                phone, 
                state, 
                lga, 
                avatar_url: avatarUrl,
                allow_push: allowPush
              }
            ]);
          }

          showMsg('Account created successfully! Please check your email to verify your account.', 'success');
        } 
        else if (currentMode === 'forgot') {
          const email = document.getElementById('forgotEmail').value.trim();
          const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset-password.html',
          });
          if (error) throw error;

          showMsg('Password reset link sent! Check your inbox.', 'success');
        }
      } catch (err) {
        showMsg(err.message || 'An unexpected error occurred.', 'error');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
      }
    }

    function showMsg(text, type) {
      const msgBox = document.getElementById('formMessage');
      msgBox.innerText = text;
      msgBox.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
      
      if (type === 'success') {
        msgBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      } else {
        msgBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
      }
    }
